# Build + GitHub release on push to main-update (beta) or manual stable dispatch.
# Push to main-update: auto-tags v3.0.0-beta.N (pre-release).
# workflow_dispatch with version: tags vX.Y.Z (regular release, not pre-release).
# Release assets: DMX.exe, DMX.zip (deploy/ contents at zip root), InitialSetup.zip.

name: Release

on:
  push:
    branches:
      - main-update
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable semver (e.g. 3.0.0). Omit the v prefix.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $isStable = '${{ github.event_name }}' -eq 'workflow_dispatch'
          if ($isStable) {
            $version = '${{ github.event.inputs.version }}'.Trim()
            if ($version -match '^v') { $version = $version.Substring(1) }
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "Stable version must be semver X.Y.Z (got: $version)"
            }
            $tag = "v$version"
            $prevTag = (git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | Where-Object { $_ -notmatch '-beta' } | Sort-Object { [version]($_ -replace '^v','') } -Descending | Select-Object -First 1)
            if (-not $prevTag) {
              $betaTags = @(git tag -l 'v3.0.0-beta.*')
              $prevTag = ($betaTags | Sort-Object { [int]($_ -replace '^v3\.0\.0-beta\.','') } -Descending | Select-Object -First 1)
            }
            $prerelease = 'false'
          } else {
            $tags = @(git tag -l 'v3.0.0-beta.*')
            $maxN = 0
            foreach ($t in $tags) {
              if ($t -match '^v3\.0\.0-beta\.(\d+)$') {
                $n = [int]$matches[1]
                if ($n -gt $maxN) { $maxN = $n }
              }
            }
            $nextN = $maxN + 1
            $version = "3.0.0-beta.$nextN"
            $tag = "v$version"
            $prevTag = if ($maxN -gt 0) { "v3.0.0-beta.$maxN" } else { "" }
            $prerelease = 'true'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prev_tag=$prevTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next release: $tag (prerelease=$prerelease, previous: $(if ($prevTag) { $prevTag } else { 'none' }))"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: >
          msbuild src/DMX_Remake.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Package DMX.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "DMX"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          # deploy/ contents at zip root — no deploy/ wrapper; DATA excluded
          robocopy deploy $staging /E /XD DATA /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          $zip = Join-Path $env:GITHUB_WORKSPACE "DMX.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          {
            echo "## ${NEW_TAG}"
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              echo "Changes since \`${PREV_TAG}\`:"
            elif echo "$NEW_TAG" | grep -q '\-beta'; then
              echo "First v3.0.0-beta pre-release."
            else
              echo "First stable release in this series."
            fi
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              git log "${PREV_TAG}..${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            else
              git log -30 "${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
          } > release_notes.md

          if command -v gh >/dev/null 2>&1; then
            {
              echo "### Merged pull requests"
              echo ""
              PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main-update&per_page=100" \
                --jq '.[] | select(.merged_at != null) | "\(.merged_at) \(.number) \(.title)"' 2>/dev/null || true)
              if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1 && [ -n "$PRS" ]; then
                PREV_DATE=$(git log -1 --format=%aI "${PREV_TAG}")
                echo "$PRS" | while read -r line; do
                  [ -z "$line" ] && continue
                  merged_at=$(echo "$line" | awk '{print $1}')
                  if [ -n "$PREV_DATE" ] && [[ "$merged_at" > "$PREV_DATE" ]]; then
                    num=$(echo "$line" | awk '{print $2}')
                    title=$(echo "$line" | cut -d' ' -f3-)
                    echo "- #${num}: ${title}"
                  fi
                done
              elif [ -z "$PREV_TAG" ] && [ -n "$PRS" ]; then
                echo "$PRS" | head -20 | while read -r line; do
                  [ -z "$line" ] && continue
                  num=$(echo "$line" | awk '{print $2}')
                  title=$(echo "$line" | cut -d' ' -f3-)
                  echo "- #${num}: ${title}"
                done
              else
                echo "_No merged PR metadata available._"
              fi
              echo ""
            } >> release_notes.md
          fi

          if [ -f changelog.md ] && grep -q '^## Unreleased' changelog.md; then
            EXCERPT=$(awk '/^## Unreleased/{found=1; next} found && /^## /{exit} found{print}' changelog.md \
              | sed '/^$/d' | grep -Ev '^_.*_$' || true)
            if [ -n "$EXCERPT" ]; then
              {
                echo "### Changelog"
                echo ""
                echo "$EXCERPT"
                echo ""
              } >> release_notes.md
            fi
          fi

          cat release_notes.md

      - name: Promote changelog Unreleased to release tag
        id: changelog
        shell: bash
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import re
          import sys

          tag = os.environ["NEW_TAG"]
          path = "changelog.md"

          with open(path, encoding="utf-8") as f:
              content = f.read()

          match = re.search(r"(?m)^## Unreleased\s*\n(.*?)(?=^## |\Z)", content, re.S)
          if not match:
              sys.exit(0)

          body_lines = [
              ln for ln in match.group(1).splitlines()
              if ln.strip() and not re.fullmatch(r"_.*_", ln.strip())
          ]
          if not body_lines:
              print("No unreleased changelog entries to promote.")
              sys.exit(0)

          excerpt = "\n".join(body_lines) + "\n"
          before = content[: match.start()]
          after = content[match.end() :].lstrip("\n")

          placeholder = (
              "## Unreleased\n\n"
              "_Add new changes here. Only this section is included in the next release notes._\n\n"
          )
          new_section = f"## {tag}\n\n{excerpt}\n"
          new_content = before + placeholder + new_section + after

          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(new_content)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("promoted=true\n")
          print(f"Promoted Unreleased section to ## {tag}")
          PY

      - name: Package InitialSetup.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "InitialSetup"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          New-Item -ItemType Directory -Path "$staging/deploy" | Out-Null
          robocopy deploy "$staging/deploy" /E /XD DATA /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          Copy-Item -Path firmware -Destination "$staging/firmware" -Recurse
          Copy-Item -Path README.md, changelog.md, install.ps1, run_once_win_xp.bat -Destination $staging

          $zip = Join-Path $env:GITHUB_WORKSPACE "InitialSetup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            deploy/DMX.exe
            DMX.zip
            InitialSetup.zip

      - name: Commit promoted changelog
        if: steps.changelog.outputs.promoted == 'true'
        shell: bash
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "chore: changelog for ${NEW_TAG} [skip release]"
          git push
