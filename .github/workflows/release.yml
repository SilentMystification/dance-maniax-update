# Build + GitHub release on push to main, develop, or main-update, or manual dispatch.
# Push: auto-tags v3.0.0-beta.N (regular release, not marked pre-release).
# workflow_dispatch with version: tags vX.Y.Z (regular release).
# Release assets: DMX.exe, DMX.zip (deploy/ contents at zip root), InitialSetup.zip.

name: Release

on:
  push:
    branches:
      - main
      - develop
      - main-update
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable semver (e.g. 3.0.0). Omit the v prefix.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Fetch tags for version
        shell: bash
        run: git fetch --tags --force

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $isStable = '${{ github.event_name }}' -eq 'workflow_dispatch'
          if ($isStable) {
            $version = '${{ github.event.inputs.version }}'.Trim()
            if ($version -match '^v') { $version = $version.Substring(1) }
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "Stable version must be semver X.Y.Z (got: $version)"
            }
            $tag = "v$version"
            $existingStable = git ls-remote --tags origin "refs/tags/$tag"
            if ($existingStable) {
              Write-Error "Stable tag $tag already exists on remote. Pick a new version."
            }
            $prevTag = (git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | Where-Object { $_ -notmatch '-beta' } | Sort-Object { [version]($_ -replace '^v','') } -Descending | Select-Object -First 1)
            if (-not $prevTag) {
              $betaTags = @(git tag -l 'v3.0.0-beta.*')
              $prevTag = ($betaTags | Sort-Object { [int]($_ -replace '^v3\.0\.0-beta\.','') } -Descending | Select-Object -First 1)
            }
            $prerelease = 'false'
          } else {
            # ls-remote sees all remote beta tags (shallow checkout may omit local tag -l entries)
            $betaTagNames = @()
            git ls-remote --tags origin 'refs/tags/v3.0.0-beta.*' | ForEach-Object {
              if ($_ -match 'refs/tags/(v3\.0\.0-beta\.\d+)$') {
                $betaTagNames += $matches[1]
              }
            }
            if ($betaTagNames.Count -eq 0) {
              $betaTagNames = @(git tag -l 'v3.0.0-beta.*')
            }
            $maxN = 0
            foreach ($t in $betaTagNames) {
              if ($t -match '^v3\.0\.0-beta\.(\d+)$') {
                $n = [int]$matches[1]
                if ($n -gt $maxN) { $maxN = $n }
              }
            }
            $nextN = $maxN + 1
            # Skip any tag numbers already taken on remote (handles stale local tag lists and races)
            do {
              $version = "3.0.0-beta.$nextN"
              $tag = "v$version"
              $existingBeta = git ls-remote --tags origin "refs/tags/$tag"
              if ($existingBeta) {
                Write-Host "Tag $tag already exists on remote, trying next number..."
                $nextN++
              }
            } while ($existingBeta)
            $prevTag = if ($nextN -gt 1) { "v3.0.0-beta.$($nextN - 1)" } else { "" }
            $prerelease = 'false'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prev_tag=$prevTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next release: $tag (prerelease=$prerelease, previous: $(if ($prevTag) { $prevTag } else { 'none' }))"

      - name: Validate release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote origin "refs/tags/${TAG}^{}" | head -1 || true)
          if [ -n "$REMOTE" ]; then
            REMOTE_SHA="${REMOTE%%$'\t'*}"
            if [ "$REMOTE_SHA" = "$RELEASE_SHA" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Tag ${TAG} exists at ${RELEASE_SHA} without a release (orphaned tag); will create release later."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists at ${REMOTE_SHA}, expected unused tag or ${RELEASE_SHA}."
            exit 1
          fi
          echo "Tag ${TAG} is available for ${RELEASE_SHA}"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Production build objects
        uses: actions/cache@v4
        with:
          path: src/DMX_Remake/Production
          key: ${{ runner.os }}-msbuild-production-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/DMX_Remake.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-production-

      - name: Build Production
        run: >
          msbuild src/DMX_Remake.vcxproj
          /m
          /p:Configuration=Production
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Remove debug symbols from deploy
        shell: pwsh
        run: |
          Get-ChildItem -Path deploy -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Package DMX.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "DMX"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          # deploy/ contents at zip root — no deploy/ wrapper; DATA and PDB excluded
          robocopy deploy $staging /E /XD DATA /XF *.pdb /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          $zip = Join-Path $env:GITHUB_WORKSPACE "DMX.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Fetch full git history for release notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse --is-shallow-repository | grep -qi true; then
            git fetch --unshallow
          fi

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## ${NEW_TAG}"
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              echo "Changes since \`${PREV_TAG}\`:"
            elif echo "$NEW_TAG" | grep -q '\-beta'; then
              echo "First v3.0.0-beta release."
            else
              echo "First release in this series."
            fi
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              git log "${PREV_TAG}..${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            else
              git log -30 "${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
          } > release_notes.md

          if command -v gh >/dev/null 2>&1; then
            {
              echo "### Merged pull requests"
              echo ""
              PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${GITHUB_REF_NAME}&per_page=100" \
                --jq '.[] | select(.merged_at != null) | "\(.merged_at) \(.number) \(.title)"' 2>/dev/null || true)
              if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1 && [ -n "$PRS" ]; then
                PREV_DATE=$(git log -1 --format=%aI "${PREV_TAG}")
                echo "$PRS" | while read -r line; do
                  [ -z "$line" ] && continue
                  merged_at=$(echo "$line" | awk '{print $1}')
                  if [ -n "$PREV_DATE" ] && [[ "$merged_at" > "$PREV_DATE" ]]; then
                    num=$(echo "$line" | awk '{print $2}')
                    title=$(echo "$line" | cut -d' ' -f3-)
                    echo "- #${num}: ${title}"
                  fi
                done
              elif [ -z "$PREV_TAG" ] && [ -n "$PRS" ]; then
                echo "$PRS" | head -20 | while read -r line; do
                  [ -z "$line" ] && continue
                  num=$(echo "$line" | awk '{print $2}')
                  title=$(echo "$line" | cut -d' ' -f3-)
                  echo "- #${num}: ${title}"
                done
              else
                echo "_No merged PR metadata available._"
              fi
              echo ""
            } >> release_notes.md
          fi

          cat release_notes.md

      - name: Package InitialSetup.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "InitialSetup"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          New-Item -ItemType Directory -Path "$staging/deploy" | Out-Null
          robocopy deploy "$staging/deploy" /E /XD DATA /XF *.pdb /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          Copy-Item -Path firmware -Destination "$staging/firmware" -Recurse
          Copy-Item -Path README.md, install.ps1, run_once_win_xp.bat -Destination $staging

          $zip = Join-Path $env:GITHUB_WORKSPACE "InitialSetup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}' | head -1 || true)
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Tag ${TAG} already exists at ${REMOTE_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
            if [ "$EXISTING_SHA" = "$RELEASE_SHA" ]; then
              echo "Release ${TAG} already exists at ${RELEASE_SHA}; treating as successful re-run."
              exit 0
            fi
            echo "::error::Release ${TAG} already exists at ${EXISTING_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi

          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            deploy/DMX.exe \
            DMX.zip \
            InitialSetup.zip

          CREATED_SHA=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
          if [ "$CREATED_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Release ${TAG} points to ${CREATED_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi
          echo "Release ${TAG} created at ${CREATED_SHA}"
