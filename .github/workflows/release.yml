# Build + GitHub release on push to release/beta, or manual dispatch.
# Tags are fully automatic, shaped "DMX-XX-YYYYMMDDVV":
#   XX      = channel: 00 stable (push to release, or workflow_dispatch), 01 beta (push to beta)
#             - see the in-game Update Settings channel selector.
#   YYYYMMDD = the UTC build date (the same date the compiled binary's __DATE__ will embed).
#   VV      = a per-channel daily sequence number (independent per channel), so a channel can
#             release more than once a day without a tag collision.
# There is no manual version number anymore - every channel is versioned purely from build date.
# release only ever advances by merging beta (the standing beta->release promotion PR) - direct
# pushes to release are blocked by branch protection, so this build always reflects a promotion.
# feature/** branches build via feature-build.yml instead - CI artifact only, no tag/release.
# Release assets: DMX.exe (Production build, code-signed if SIGNING_CERT_BASE64 secret is set), DMX.zip, InitialSetup.zip.
# Release CI builds Production only; use scripts/build-all.ps1 or VS All/DeployToCab locally for all three exes.
#
# Job graph:
#   prepare ──┬── build ──────────┐
#             └── release-notes ──┴── create-release

name: Release

on:
  push:
    branches:
      - release
      - beta
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          # channel: 00 stable (push to release, or manual dispatch), 01 beta (push to beta)
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $channel = 0
          } elseif ('${{ github.ref_name }}' -eq 'release') {
            $channel = 0
          } else {
            $channel = 1
          }
          $channelStr = $channel.ToString('00')

          # the build date, in the same UTC-day sense __DATE__ will embed once this same workflow compiles it
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $datePrefix = "DMX-$channelStr-$date"

          # per-channel, per-date sequence number - independent of the other two channels
          $seqTagNames = @()
          git ls-remote --tags origin "refs/tags/$datePrefix*" | ForEach-Object {
            if ($_ -match "refs/tags/($datePrefix\d{2})$") {
              $seqTagNames += $matches[1]
            }
          }
          if ($seqTagNames.Count -eq 0) {
            $seqTagNames = @(git tag -l "$datePrefix*")
          }
          $maxSeq = -1
          foreach ($t in $seqTagNames) {
            if ($t -match "^$datePrefix(\d{2})$") {
              $n = [int]$matches[1]
              if ($n -gt $maxSeq) { $maxSeq = $n }
            }
          }
          $nextSeq = $maxSeq + 1
          # skip any sequence numbers already taken on remote (handles stale local tag lists and races)
          do {
            $tag = "$datePrefix$($nextSeq.ToString('00'))"
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ($existing) {
              Write-Host "Tag $tag already exists on remote, trying next number..."
              $nextSeq++
            }
          } while ($existing)
          $version = $tag

          # previous tag ON THE SAME CHANNEL (any date), for release-notes' "changes since" diff
          $channelTagNames = @()
          git ls-remote --tags origin "refs/tags/DMX-$channelStr-*" | ForEach-Object {
            if ($_ -match "refs/tags/(DMX-$channelStr-\d{10})$") {
              $channelTagNames += $matches[1]
            }
          }
          if ($channelTagNames.Count -eq 0) {
            $channelTagNames = @(git tag -l "DMX-$channelStr-*")
          }
          # fixed-width, digits-only suffix - plain string sort already gives correct chronological order
          $prevTag = ($channelTagNames | Where-Object { $_ -ne $tag } | Sort-Object -Descending | Select-Object -First 1)

          $prerelease = if ($channel -eq 0) { 'false' } else { 'true' }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prev_tag=$prevTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next release: $tag (prerelease=$prerelease, previous: $(if ($prevTag) { $prevTag } else { 'none' }))"

      - name: Validate release tag is unused
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote origin "refs/tags/${TAG}^{}" | head -1 || true)
          if [ -n "$REMOTE" ]; then
            REMOTE_SHA="${REMOTE%%$'\t'*}"
            if [ "$REMOTE_SHA" = "$RELEASE_SHA" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Tag ${TAG} exists at ${RELEASE_SHA} without a release (orphaned tag); will create release later."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists at ${REMOTE_SHA}, expected unused tag or ${RELEASE_SHA}."
            exit 1
          fi
          echo "Tag ${TAG} is available for ${RELEASE_SHA}"

  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stamp release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $content = @"
#ifndef _RELEASETAG_H
#define _RELEASETAG_H

#define DMX_RELEASE_TAG "$env:RELEASE_TAG"

#endif
"@
          Set-Content -Path src/headers/releaseTag.h -Value $content
          Write-Host "Stamped DMX_RELEASE_TAG = $env:RELEASE_TAG"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Production build objects
        uses: actions/cache@v4
        with:
          path: src/DMX_Remake/Production
          key: ${{ runner.os }}-msbuild-production-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/DMX_Remake.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-production-

      - name: Build Production
        run: >
          msbuild src/DMX_Remake.vcxproj
          /m
          /p:Configuration=Production
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Verify Production output
        shell: pwsh
        run: |
          if (-not (Test-Path deploy/DMX_PROD.exe)) {
            Write-Error 'Missing deploy/DMX_PROD.exe'
          }
          Write-Host 'OK: deploy/DMX_PROD.exe'

      - name: Prepare DMX.exe for release
        shell: pwsh
        run: |
          if (-not (Test-Path deploy/DMX_PROD.exe)) {
            Write-Error 'Missing deploy/DMX_PROD.exe'
          }
          Copy-Item -Path deploy/DMX_PROD.exe -Destination deploy/DMX.exe -Force
          Remove-Item deploy/DMX_PROD.exe, deploy/DMX_DEBUG.exe, deploy/DMX_DEV.exe -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path deploy/DMX.exe)) {
            Write-Error 'Missing deploy/DMX.exe after prepare step'
          }
          Write-Host 'OK: deploy/DMX.exe (from Production build)'

      - name: Sign DMX.exe (skips if no certificate configured)
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERT_BASE64)) {
            Write-Host 'No SIGNING_CERT_BASE64 secret configured; skipping code signing.'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
            if (-not $signtool) { $signtool = 'signtool.exe' }
            & $signtool sign /f $pfxPath /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 deploy/DMX.exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package DMX.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "DMX"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          # deploy/ contents at zip root — no deploy/ wrapper; DATA and PDB excluded
          robocopy deploy $staging /E /XD DATA /XF *.pdb /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          $zip = Join-Path $env:GITHUB_WORKSPACE "DMX.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Package InitialSetup.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "InitialSetup"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          New-Item -ItemType Directory -Path "$staging/deploy" | Out-Null
          robocopy deploy "$staging/deploy" /E /XD DATA /XF *.pdb /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          Copy-Item -Path firmware -Destination "$staging/firmware" -Recurse
          Copy-Item -Path README.md, install.ps1, run_once_win_xp.bat -Destination $staging

          $zip = Join-Path $env:GITHUB_WORKSPACE "InitialSetup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            deploy/DMX.exe
            DMX.zip
            InitialSetup.zip

  release-notes:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Fetch full git history for release notes
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --is-shallow-repository | grep -qi true; then
            git fetch --unshallow
          fi

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.prepare.outputs.tag }}
          PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## ${NEW_TAG}"
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              echo "Changes since \`${PREV_TAG}\`:"
            else
              echo "First release on this channel."
            fi
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              git log "${PREV_TAG}..${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            else
              git log -30 "${RELEASE_SHA}" --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
          } > release_notes.md

          if command -v gh >/dev/null 2>&1; then
            {
              echo "### Merged pull requests"
              echo ""
              PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${GITHUB_REF_NAME}&per_page=100" \
                --jq '.[] | select(.merged_at != null) | "\(.merged_at) \(.number) \(.title)"' 2>/dev/null || true)
              if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1 && [ -n "$PRS" ]; then
                PREV_DATE=$(git log -1 --format=%aI "${PREV_TAG}")
                echo "$PRS" | while read -r line; do
                  [ -z "$line" ] && continue
                  merged_at=$(echo "$line" | awk '{print $1}')
                  if [ -n "$PREV_DATE" ] && [[ "$merged_at" > "$PREV_DATE" ]]; then
                    num=$(echo "$line" | awk '{print $2}')
                    title=$(echo "$line" | cut -d' ' -f3-)
                    echo "- #${num}: ${title}"
                  fi
                done
              elif [ -z "$PREV_TAG" ] && [ -n "$PRS" ]; then
                echo "$PRS" | head -20 | while read -r line; do
                  [ -z "$line" ] && continue
                  num=$(echo "$line" | awk '{print $2}')
                  title=$(echo "$line" | cut -d' ' -f3-)
                  echo "- #${num}: ${title}"
                done
              else
                echo "_No merged PR metadata available._"
              fi
              echo ""
            } >> release_notes.md
          fi

          cat release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  create-release:
    needs: [prepare, build, release-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}' | head -1 || true)
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Tag ${TAG} already exists at ${REMOTE_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
            if [ "$EXISTING_SHA" = "$RELEASE_SHA" ]; then
              echo "Release ${TAG} already exists at ${RELEASE_SHA}; treating as successful re-run."
              exit 0
            fi
            echo "::error::Release ${TAG} already exists at ${EXISTING_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi

          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            assets/deploy/DMX.exe \
            assets/DMX.zip \
            assets/InitialSetup.zip

          CREATED_SHA=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
          if [ "$CREATED_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Release ${TAG} points to ${CREATED_SHA}, expected ${RELEASE_SHA}"
            exit 1
          fi
          echo "Release ${TAG} created at ${CREATED_SHA}"
