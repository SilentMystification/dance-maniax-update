# Build-only CI for feature/** branches - no tag, no GitHub Release, no interaction with the
# in-game update channel system (see release.yml for that). Just a downloadable artifact per push
# so a feature branch can be handed to someone to test without going anywhere near beta/release.

name: Feature build

on:
  push:
    branches:
      - 'feature/**'
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Production build objects
        uses: actions/cache@v4
        with:
          path: src/DMX_Remake/Production
          key: ${{ runner.os }}-msbuild-production-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/DMX_Remake.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-production-

      - name: Build Production
        run: >
          msbuild src/DMX_Remake.vcxproj
          /m
          /p:Configuration=Production
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Verify Production output
        shell: pwsh
        run: |
          if (-not (Test-Path deploy/DMX_PROD.exe)) {
            Write-Error 'Missing deploy/DMX_PROD.exe'
          }
          Write-Host 'OK: deploy/DMX_PROD.exe'

      - name: Prepare DMX.exe for artifact
        shell: pwsh
        run: |
          Copy-Item -Path deploy/DMX_PROD.exe -Destination deploy/DMX.exe -Force
          Remove-Item deploy/DMX_PROD.exe, deploy/DMX_DEBUG.exe, deploy/DMX_DEV.exe -Force -ErrorAction SilentlyContinue

      - name: Package DMX.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "DMX"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          # deploy/ contents at zip root - no deploy/ wrapper; DATA and PDB excluded
          robocopy deploy $staging /E /XD DATA /XF *.pdb /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          $zip = Join-Path $env:GITHUB_WORKSPACE "DMX.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Compute artifact name
        id: artifact
        shell: pwsh
        run: |
          $branch = '${{ github.ref_name }}' -replace '/', '-'
          "name=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            deploy/DMX.exe
            DMX.zip
          retention-days: 14
