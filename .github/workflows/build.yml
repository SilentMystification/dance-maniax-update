# Build-only CI: feature/** and master pushes, and all PRs.
# Pushes to main, develop, and main-update are handled by release.yml (which also builds).

name: Build

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache Production build objects
        uses: actions/cache@v4
        with:
          path: src/DMX_Remake/Production
          key: ${{ runner.os }}-msbuild-production-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/DMX_Remake.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-production-

      - name: Build Production
        run: >
          msbuild src/DMX_Remake.vcxproj
          /m
          /p:Configuration=Production
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Upload DMX_PROD.exe
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: DMX_PROD.exe
          path: deploy/DMX_PROD.exe
