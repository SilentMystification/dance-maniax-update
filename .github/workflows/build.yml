# Build-only CI: feature/** pushes, main/master, and all PRs.
# Push to main-update triggers release.yml (build + GitHub pre-release).

name: Build

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: >
          msbuild src/DMX_Remake.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Upload DMX.exe
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: DMX.exe
          path: deploy/DMX.exe
