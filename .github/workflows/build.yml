# Build-only CI: feature/** and master pushes, and all PRs.
# Pushes to main, develop, and main-update are handled by release.yml (Production build).
# Local all-config builds: scripts/build-all.ps1 or VS configurations All / DeployToCab.

name: Build

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: |
            src/DMX_Remake/Dev
            src/DMX_Remake/Debug
            src/DMX_Remake/Production
          key: ${{ runner.os }}-msbuild-all-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/DMX_Remake.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-all-

      - name: Build Dev, Debug, and Production (parallel)
        shell: pwsh
        run: ./scripts/build-all.ps1

      - name: Upload All-profile executables
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: dmx-all-profile
          path: |
            deploy/DMX_DEBUG.exe
            deploy/DMX_DEV.exe
            deploy/DMX_PROD.exe
