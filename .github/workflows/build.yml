# Build-only CI: feature/** pushes, main/master, and all PRs.
# Push to main-update triggers release.yml (build + GitHub pre-release).

name: Build

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: >
          msbuild src/DMX_Remake.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v145
          /t:Build
          /v:minimal

      - name: Package InitialSetup.zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "InitialSetup"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          # deploy/ — repo contents + built exe; DATA is gitignored and not included
          New-Item -ItemType Directory -Path "$staging/deploy" | Out-Null
          robocopy deploy "$staging/deploy" /E /XD DATA /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

          Copy-Item -Path firmware -Destination "$staging/firmware" -Recurse
          Copy-Item -Path README.md, changelog.md, install.ps1, run_once_win_xp.bat -Destination $staging

          $zip = Join-Path $env:GITHUB_WORKSPACE "InitialSetup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - name: Upload DMX.exe
        uses: actions/upload-artifact@v4
        with:
          name: DMX.exe
          path: deploy/DMX.exe

      - name: Upload InitialSetup.zip
        uses: actions/upload-artifact@v4
        with:
          name: InitialSetup.zip
          path: InitialSetup.zip
